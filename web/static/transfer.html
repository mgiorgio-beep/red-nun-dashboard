<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Red Nun — Transfer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0c;--card:#1a1a1e;--card2:#222226;--border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.15);--text:#f5f5f7;--text2:rgba(245,245,247,0.6);
  --text3:rgba(245,245,247,0.35);--red:#FF453A;--green:#30D158;--blue:#0A84FF;--orange:#FF9F0A;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.hdr{position:sticky;top:0;z-index:100;padding:calc(var(--safe-top) + 12px) 16px 12px;
  background:rgba(10,10,12,0.85);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-logo{width:32px;height:32px;background:linear-gradient(135deg,var(--red),#FF6259);border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff}
.hdr-title{font-size:17px;font-weight:700;letter-spacing:-0.3px}
.hdr-sub{font-size:10px;color:var(--text3);font-weight:500}
.hdr a{color:var(--blue);font-size:14px;font-weight:600;text-decoration:none}
.wrap{padding:16px 16px calc(var(--safe-bottom) + 110px);max-width:640px;margin:0 auto}
.label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px}
.dir{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dir button{padding:16px 10px;border-radius:14px;background:var(--card);border:1.5px solid var(--border2);
  color:var(--text);font:600 15px Inter,sans-serif}
.dir button.sel{border-color:var(--blue);background:rgba(10,132,255,0.14);color:#fff}
.search{width:100%;padding:13px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border2);
  color:var(--text);font:500 16px Inter,sans-serif;outline:none}
.results{margin-top:6px}
.res{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}
.res:active{background:var(--card2)}
.res .u,.line .u{font-size:11px;color:var(--blue);font-weight:700}
.line{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:8px;background:var(--card);
  border:1px solid var(--border);border-radius:14px}
.line .n{flex:1;min-width:0;font-weight:600;font-size:15px}
.step{width:40px;height:40px;border-radius:10px;background:var(--card2);border:1px solid var(--border2);
  color:var(--text);font-size:20px}
.qty{width:58px;height:40px;text-align:center;border-radius:10px;background:var(--bg);border:1px solid var(--border2);
  color:var(--text);font:700 17px Inter,sans-serif}
.x{background:none;border:none;color:var(--red);font-size:18px;padding:0 4px}
.empty{color:var(--text3);font-size:14px;padding:10px 2px}
.bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(var(--safe-bottom) + 12px);
  background:rgba(10,10,12,0.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-top:1px solid var(--border)}
.send{width:100%;max-width:640px;margin:0 auto;display:block;padding:15px;border-radius:12px;border:none;
  background:var(--green);color:#000;font:700 16px Inter,sans-serif}
.send:disabled{opacity:.35}
.conn{font-size:11px;font-weight:700;text-align:center;margin-bottom:8px;color:var(--orange)}
.hist{padding:11px 2px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;font-size:14px}
.hist .m{flex:1;min-width:0}
.hist .s{font-size:11px;color:var(--text3);margin-top:2px}
.hist.void .m{text-decoration:line-through;color:var(--text3)}
.undo{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:6px 10px;font:600 12px Inter,sans-serif}
.sayrow{display:flex;gap:8px}
.sayrow .search{flex:1}
.saybtn{padding:0 18px;border-radius:12px;border:none;background:var(--blue);color:#fff;font:700 16px Inter,sans-serif}
.vcard{margin-top:10px;padding:14px;border-radius:14px;background:var(--card);border:1.5px solid var(--border2)}
.vcard pre{font:700 17px Inter,sans-serif;white-space:pre-wrap;line-height:1.35}
.vcard .say{font-size:13px;color:var(--text2);margin-top:6px}
.vbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.vbtns button,.vopt{padding:14px;border-radius:12px;border:1px solid var(--border2);background:var(--card2);color:var(--text);font:700 15px Inter,sans-serif;text-align:left}
.vbtns .ok{background:var(--green);color:#000;border:none;text-align:center}
.vbtns .fx{text-align:center}
.vopt{display:block;width:100%;margin-top:8px}
.hist .cost{font-size:12px;color:var(--text2);white-space:nowrap}
.hist.hl{background:rgba(10,132,255,0.12)}
.nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--border);
  background:var(--bg);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;padding:10px 16px;border-radius:20px;background:var(--card);border:1px solid var(--border2);
  color:var(--text2);font:600 15px Inter,sans-serif;text-decoration:none}
.nav a.on{background:var(--blue);border-color:var(--blue);color:#fff}
.nav a.own{display:none}
/* PC with dashboard login (deskMode): dashboard palette + sidebar */
body.desk .hdr,body.desk .nav{display:none}
body.desk .wrap{max-width:1100px;margin:0;padding:24px 24px 110px}
body.desk .bar{left:var(--sb-width,230px);background:#fff;border-top:1px solid #e5e7eb;backdrop-filter:none;-webkit-backdrop-filter:none}
body.desk .send{color:#fff}
body.desk .dir button.sel{background:#eff6ff;color:#1d4ed8}
body.desk .vcard pre{color:#111827}
body.desk .send{max-width:1100px;margin:0}
.toast{position:fixed;left:50%;top:calc(var(--safe-top) + 70px);transform:translateX(-50%);z-index:200;
  background:var(--card2);border:1px solid var(--border2);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}.toast.err{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-left"><div class="hdr-logo">RN</div>
    <div><div class="hdr-title">Transfer</div><div class="hdr-sub">STOCK BETWEEN THE HOUSES</div></div></div>
</div>
<div class="nav" id="nav"><a href="/transfer" class="on ">Transfer</a><a href="/waste" class="">Waste</a><a href="/transfer/settle" class="own">Reconcile</a><a href="/transfer/statement" class="own">Statement</a><a href="/transfer/admin" class="own">Admin</a><a href="/" class="own">Dashboard</a></div>
<div class="toast" id="toast"></div>

<div class="wrap">
  <div class="label">Say it or type it</div>
  <div class="sayrow">
    <input class="search" id="say" placeholder="2 cases of Tito's to Dennis" autocomplete="off" enterkeyhint="go"
           onkeydown="if(event.key==='Enter')sayIt()">
    <button class="saybtn" onclick="sayIt()">Go</button>
  </div>
  <div id="vbox"></div>

  <div class="label" style="margin-top:26px">Or pick — which way?</div>
  <div class="dir">
    <button data-from="chatham" data-to="dennis" onclick="pickDir(this)">Chatham → Dennis</button>
    <button data-from="dennis" data-to="chatham" onclick="pickDir(this)">Dennis → Chatham</button>
  </div>

  <div class="label">What's going?</div>
  <input class="search" id="q" placeholder="Search a product… (e.g. titos)" autocomplete="off" oninput="search()">
  <div class="results" id="results"></div>
  <div id="lines" style="margin-top:12px"></div>

  <div class="label" style="display:flex;justify-content:space-between">Last 30 days <span>
    <a href="/transfer/statement" style="color:var(--blue);text-decoration:none;text-transform:none;letter-spacing:0">Month statement ›</a>
    <a href="/transfer/admin" id="adminlink" style="display:none;color:var(--blue);text-decoration:none;text-transform:none;letter-spacing:0;margin-left:10px">Admin ›</a></span></div>
  <div id="history"><div class="empty">Loading…</div></div>
</div>

<div class="bar">
  <div class="conn" id="conn"></div>
  <button class="send" id="send" disabled onclick="send()">Pick a direction</button>
</div>

<script>
// Staff don't log in: the phone carries its person's token (from the setup link).
const TKEY = 'rn_move_token';
(function(){ const m = /[#&]k=([^&]+)/.exec(location.hash); if (m) { try { localStorage.setItem(TKEY, decodeURIComponent(m[1])); } catch(e) {} } })();
function moveToken(){ try { return localStorage.getItem(TKEY) || ''; } catch(e) { return ''; } }
function authFetch(url, opts){
  opts = Object.assign({credentials: 'include'}, opts || {});
  const t = moveToken();
  if (t) opts.headers = Object.assign({}, opts.headers || {}, {Authorization: 'Bearer ' + t});
  return fetch(url, opts);
}

// On a PC with a dashboard login, look like every other dashboard page:
// the sidebar, the dashboard's colors, no phone header. Phones and staff keys
// keep the phone layout (staff have no dashboard login for the sidebar).
function deskMode(u){
  if (!u || u.via_token || window.innerWidth < 768) return;
  document.body.classList.add('desk');
  const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/static/sidebar.css'; document.head.appendChild(l);
  const sc = document.createElement('script'); sc.src = '/static/sidebar.js'; document.body.appendChild(sc);
}
function notSetUp(){
  document.querySelector('.wrap').innerHTML = '<div style="padding:60px 10px;text-align:center"><div style="font-size:48px">📱</div>' +
    '<h2 style="margin:12px 0 8px">This phone isn\'t set up.</h2><p style="color:var(--text2)">Ask Mike for your setup link.</p>' +
    '<p style="margin-top:24px;font-size:13px"><a style="color:var(--blue)" href="/login?next=' + encodeURIComponent(location.pathname) + '">Dashboard login</a></p></div>';
  const b = document.querySelector('.bar'); if (b) b.style.display = 'none';
}
const BOOZE = ['BEER', 'LIQUOR', 'WINE'];
const T = { from: null, to: null, lines: [] };   // lines: {id, name, unit, qty}
const QKEY = 'rn_transfer_queue';

function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function toast(msg, err){ const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 2600); }
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
// Same cleanup as the count page, so a bottle reads the same on both screens.
function cleanBoozeName(n){
  let s = ' ' + (n || '') + ' ';
  s = s.replace(/\([^)]*\b(case|cs|pk|pack|bulk|ct|oz|ml|ltr)\b[^)]*\)/gi, ' ');
  s = s.replace(/\(\d+\)\w?/g, ' ');
  s = s.replace(/\b[bck]-[\d\/.]+(\s*gal\b)?/gi, ' ');
  s = s.replace(/\b\d+(\.\d+)?\s*(°|'|’|proof|pf)(?=[\s,)]|$)/gi, ' ');
  s = s.replace(/\b\d+\s*\/\s*(\d+(\.\d+)?)?\s*(cs|case|c|pk|ct|oz|z|ltr|l|cn)?(?![a-z])/gi, ' ');
  s = s.replace(/\b\d+-\d+[a-z]*\b/gi, ' ');
  s = s.replace(/\b\d+\s*(pk|pack|ct)\b(\s+(box|bottles?|cans?|loose))?/gi, ' ');
  s = s.replace(/\b\d+(\.\d+)?\s*(ml|l|ltr|litr|oz|z|m|cs)\b/gi, ' ');
  s = s.replace(/\b(case|cs|bulk|new pkg|nr|cn|litr|ltr|ltrcs|loose)\b/gi, ' ');
  s = s.replace(/[,\s]+\d{2,3}(\.\d+)?\s*$/, ' ');
  s = s.replace(/\(\s*\)/g, ' ').replace(/\s*[,\/\-]+\s*$/g, '').replace(/^\s*[,\/\-]+/, '').replace(/\s+,/g, ',').replace(/\s+/g, ' ').trim();
  if (s && s === s.toUpperCase()) s = s.toLowerCase().replace(/(^|\s)[a-z]/g, c => c.toUpperCase());
  return s || n;
}
function niceName(p){ const n = p.display_name || p.name || ''; return BOOZE.includes((p.category || '').toUpperCase()) ? cleanBoozeName(n) : n; }
const unitOf = p => p.inventory_unit || p.unit || 'ea';

function pickDir(el){
  document.querySelectorAll('.dir button').forEach(b => b.classList.toggle('sel', b === el));
  T.from = el.dataset.from; T.to = el.dataset.to;
  renderBar();
}

let _sq = 0;
async function search(){
  const q = document.getElementById('q').value.trim(), my = ++_sq, box = document.getElementById('results');
  if (q.length < 2) { box.innerHTML = ''; return; }
  try {
    const r = await authFetch('/api/transfers/products?house=' + encodeURIComponent(T.from || '') + '&q=' + encodeURIComponent(q));
    if (r.status === 401) { notSetUp(); return; }
    const rows = await r.json();
    if (my !== _sq) return;
    window._res = rows;
    box.innerHTML = rows.length ? rows.map((p, i) =>
      '<div class="res" onclick="addLine(' + i + ')"><span>' + esc(p.label) + '</span><span class="u">' + (p.here ? '' : 'not stocked here') + '</span></div>').join('')
      : '<div class="empty">No product matches “' + esc(q) + '”.</div>';
  } catch(e) { box.innerHTML = '<div class="empty">Search needs a connection.</div>'; }
}
function addLine(i){
  const p = window._res[i]; if (!p) return;
  const have = T.lines.find(l => l.id === p.id);
  if (have) have.qty += 1; else T.lines.push({ id: p.id, name: p.label, unit: null, qty: 1 });
  document.getElementById('q').value = ''; document.getElementById('results').innerHTML = '';
  renderLines();
}
function setQty(i, v){ const n = parseFloat(v); T.lines[i].qty = isNaN(n) ? 0 : Math.max(0, n); renderBar(); }
function step(i, d){ T.lines[i].qty = Math.max(0, Math.round((T.lines[i].qty + d) * 100) / 100); renderLines(); }
function drop(i){ T.lines.splice(i, 1); renderLines(); }
function renderLines(){
  document.getElementById('lines').innerHTML = T.lines.map((l, i) =>
    '<div class="line"><div class="n">' + esc(l.name) + '<div class="u">' + esc(l.unit || 'as ordered') + '</div></div>' +
    '<button class="step" onclick="step(' + i + ',-1)">−</button>' +
    '<input class="qty" type="number" inputmode="decimal" step="0.5" value="' + l.qty + '" onfocus="this.select()" oninput="setQty(' + i + ',this.value)">' +
    '<button class="step" onclick="step(' + i + ',1)">+</button>' +
    '<button class="x" onclick="drop(' + i + ')">✕</button></div>').join('');
  renderBar();
}
function renderBar(){
  const b = document.getElementById('send'), n = T.lines.filter(l => l.qty > 0).length;
  b.disabled = !T.from || !n;
  b.textContent = !T.from ? 'Pick a direction' : !n ? 'Add what\'s going' :
    'Send ' + n + ' item' + (n === 1 ? '' : 's') + ' ' + cap(T.from) + ' → ' + cap(T.to);
  const q = loadQ().length;
  document.getElementById('conn').textContent = q ? q + ' transfer' + (q === 1 ? '' : 's') + ' waiting to upload' : '';
}

// Queue on the phone first, then upload in order: works with no signal, and a
// logged-out reply keeps it queued. transfer_id makes a replay land once.
function loadQ(){ try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch(e) { return []; } }
function storeQ(q){ try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch(e) {} }
let _flushing = false;
async function flush(){
  if (_flushing || !navigator.onLine) return false;
  _flushing = true;
  try {
    let q = loadQ();
    while (q.length) {
      let ok = false;
      try {
        const r = await authFetch('/api/transfers', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(q[0])});
        ok = r.ok && (r.headers.get('content-type') || '').indexOf('json') !== -1;
        if (!ok && r.status >= 400 && r.status < 500 && r.status !== 401 && r.status !== 403) { ok = true; toast('A transfer was rejected by the server', true); }
      } catch(e) {}
      if (!ok) break;
      q = loadQ(); q.shift(); storeQ(q);
    }
    return !loadQ().length;
  } finally { _flushing = false; renderBar(); }
}
async function send(){
  const items = T.lines.filter(l => l.qty > 0);
  if (!T.from || !items.length) return;
  const summary = items.map(l => l.qty + ' ' + (l.unit || '') + ' ' + l.name).join('\n');
  if (!confirm(cap(T.from) + ' → ' + cap(T.to) + '\n\n' + summary + '\n\nSend?')) return;
  const tid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
  const q = loadQ();
  q.push({ transfer_id: tid, from_location: T.from, to_location: T.to,
           items: items.map(l => ({ product_id: l.id, quantity: l.qty, unit: l.unit || null })) });
  storeQ(q);
  T.lines = []; renderLines();
  const done = await flush();
  toast(done ? '✓ Transfer saved' : 'Saved on this phone — will upload when back online', !done);
  loadHistory();
}

const HL = new URLSearchParams(location.search).get('highlight');
async function loadHistory(){
  const box = document.getElementById('history');
  try {
    const r = await authFetch('/api/transfers?days=30');
    if (r.status === 401) { notSetUp(); return; }
    const rows = await r.json();
    window._hist = rows;
    box.innerHTML = rows.length ? rows.map((t, i) => {
      const v = t.status === 'voided';
      const d = t.business_date ? t.business_date.slice(4, 6) + '/' + t.business_date.slice(6) : '';
      return '<div class="hist' + (v ? ' void' : '') + (String(t.id) === HL ? ' hl' : '') + '" id="t' + t.id + '"><div class="m">' +
        esc(t.qty_entered + ' ' + (t.unit_entered || '') + ' ' + t.item_name) +
        '<div class="s">' + esc(cap(t.from_location) + ' → ' + cap(t.to_location) + ' · ' + d + (t.entered_by ? ' · ' + t.entered_by : '') +
          (t.entered_via === 'siri' ? ' · Siri' : '') + (t.is_settlement ? ' · return' : '') + (t.needs_link ? ' · needs link' : '') +
          (v ? ' · voided' + (t.void_reason ? ': ' + t.void_reason : '') : '')) + '</div></div>' +
        (t.total_cost != null ? '<span class="cost">$' + t.total_cost.toFixed(2) + '</span>' : '') +
        (v ? '' : '<button class="undo" onclick="editRow(' + i + ')">Edit</button><button class="undo" onclick="undo(' + t.id + ')">Void</button>') + '</div>';
    }).join('') : '<div class="empty">No transfers yet.</div>';
    if (HL) { const el = document.getElementById('t' + HL); if (el) el.scrollIntoView({block: 'center'});
      if (new URLSearchParams(location.search).get('void') === '1' && el && !el.classList.contains('void')) undo(+HL); }
  } catch(e) { box.innerHTML = '<div class="empty">History needs a connection.</div>'; }
}
async function undo(id, reason){
  reason = reason || prompt('Void this transfer? Why (optional):', '');
  if (reason === null) return;
  try {
    const r = await authFetch('/api/transfers/' + id + '/void', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({reason: reason})});
    if (!r.ok) throw new Error();
    toast('Voided'); loadHistory();
  } catch(e) { toast('Could not void — try again with a connection', true); }
}
// Edit = void the line and put it back in the picker to re-send (the record keeps both).
async function editRow(i){
  const t = window._hist[i]; if (!t) return;
  if (!confirm('Edit: this voids the line and puts it back below to change and re-send.')) return;
  await undo(t.id, 'edited');
  const btn = document.querySelector('.dir button[data-from="' + t.from_location + '"]'); if (btn) pickDir(btn);
  T.lines = [{ id: t.from_product_id, name: t.item_name, unit: t.unit_entered, qty: t.qty_entered }];
  renderLines(); window.scrollTo({top: document.getElementById('lines').offsetTop - 120, behavior: 'smooth'});
}

// ---- say / type it: same endpoint and card as the Siri Shortcut
let VP = null;
function uuid(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2); }
async function voice(body){
  const r = await authFetch('/api/transfers/voice', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (r.status === 401) { notSetUp(); throw new Error('login'); }
  return r.json();
}
async function sayIt(){
  const text = document.getElementById('say').value.trim(); if (!text) return;
  try { showV(await voice({text: text, client_id: uuid()})); } catch(e) { if (e.message !== 'login') toast('Needs a connection — use the pickers below', true); }
}
function showV(r){
  VP = r; const box = document.getElementById('vbox');
  if (r.status === 'confirm') {
    box.innerHTML = '<div class="vcard"><pre>' + esc(r.card) + '</pre><div class="say">' + esc(r.say) + '</div>' +
      '<div class="vbtns"><button class="ok" onclick="vConfirm()">Confirm</button><button class="fx" onclick="location.href=VP.fix_url">Fix</button></div></div>';
  } else if (r.status === 'choose') {
    box.innerHTML = '<div class="vcard"><div style="font-weight:700">' + esc(r.say) + '</div>' +
      r.options.map(o => '<button class="vopt" onclick="vPick(\'' + o.id + '\')">' + esc(o.label) + '</button>').join('') + '</div>';
  } else if (r.status === 'logged') {
    box.innerHTML = ''; document.getElementById('say').value = ''; toast('✓ ' + (r.say || 'Done.')); loadHistory();
  } else {
    box.innerHTML = '<div class="vcard"><div style="color:var(--orange);font-weight:700">' + esc(r.say || 'Something went wrong') + '</div>' +
      (r.fix_url ? '<div class="vbtns"><button class="fx" onclick="location.href=VP.fix_url">Open Fix page</button></div>' : '') + '</div>';
  }
}
async function vPick(id){ try { showV(await voice({pending_id: VP.pending_id, choice: id})); } catch(e) {} }
async function vConfirm(){ try { showV(await voice({pending_id: VP.pending_id, confirm: true})); } catch(e) {} }

window.addEventListener('online', () => { flush().then(loadHistory); });
renderBar();
flush().then(loadHistory);
authFetch('/api/moves/whoami').then(r => { if (r.status === 401) { notSetUp(); return null; } return r.ok ? r.json() : null; }).then(u => {
  if (!u) return;
  deskMode(u);
  if (u.owner) document.querySelectorAll('.nav a.own').forEach(a => a.style.display = 'block');
  if (u.owner && !u.via_token) document.getElementById('adminlink').style.display = '';
  // no preset direction: the same person moves stock both ways
}).catch(() => {});
</script>
