<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Red Nun — Transfer Statement</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#020617;--card:#0f172a;--card2:#1e293b;--border:#1e293b;--border2:#334155;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--red:#ef4444;--green:#22c55e;--blue:#38bdf8;--orange:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.wrap{padding:16px;max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
.sub{font-size:12px;color:var(--text3);margin-top:2px}
.ctl{display:flex;gap:8px;align-items:center}
.btn{padding:9px 12px;border-radius:10px;background:var(--card);border:1px solid var(--border2);color:var(--text);
  font:600 13px Inter,sans-serif;text-decoration:none;cursor:pointer}
.month{font-weight:700;min-width:120px;text-align:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.even{color:var(--green)}
.warn{border-color:rgba(255,159,10,.5);color:var(--orange);font-size:14px}
.h{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--text3);font-weight:600;font-size:11px;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--border2)}
td{padding:9px 6px;border-bottom:1px solid var(--border)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--text3);font-size:11px}
.zero td{color:var(--text3)}
/* Mobile: product table becomes cards */
@media (max-width:767px){
  table.lines thead{display:none}
  table.lines tr{display:block;padding:10px 0;border-bottom:1px solid var(--border)}
  table.lines td{display:flex;justify-content:space-between;border:none;padding:2px 0}
  table.lines td::before{content:attr(data-l);color:var(--text3);font-size:12px}
  table.lines td.name{font-weight:700}
  table.lines td.name::before{content:''}
  .basis{display:none}
}
@media print{
  :root{--bg:#fff;--card:#fff;--text:#000;--text2:#333;--text3:#666;--border:#ccc;--border2:#999}
  .ctl{display:none}
}
/* inside the dashboard sidebar layout */
.rn-main .wrap{max-width:1100px;margin:0;padding:24px}
@media (min-width:768px){ .bar{left:var(--sb-width,230px)} }
.bar{background:#fff !important;border-top:1px solid #e5e7eb !important}
.btn.go,.seg button.sel.pay{color:#fff}
</style>
<link rel="stylesheet" href="/static/sidebar.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Transfer Statement</h1><div class="sub">Red Buoy Inc. (Chatham) ⇄ Red Nun Public House Inc. (Dennis) — netted by item, at the cost logged</div></div>
    <div class="ctl">
      <button class="btn" onclick="shift(-1)">‹</button>
      <div class="month" id="month"></div>
      <button class="btn" onclick="shift(1)">›</button>
      <a class="btn" id="csv" href="#">CSV</a>
      <button class="btn" onclick="print()">Print</button>
      <a class="btn" id="settle" href="#" style="display:none">Settle ›</a>
      <a class="btn" href="/transfer">Transfers</a>
    </div>
  </div>
  <div id="out"><div class="card">Loading…</div></div>
</div>
<script>
let M = new URLSearchParams(location.search).get('month');
if (!/^\d{4}-\d{2}$/.test(M || '')) { const d = new Date(); M = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
let SHOW_VOID = false;
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function money(x){ return x == null ? '—' : (x < 0 ? '−$' : '$') + Math.abs(x).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function q(x){ return Math.round(x * 100) / 100; }
function shift(n){ const [y, m] = M.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); M = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); load(); }
async function load(){
  history.replaceState(null, '', '?month=' + M);
  const [y, m] = M.split('-').map(Number);
  document.getElementById('month').textContent = new Date(y, m - 1, 1).toLocaleString(undefined, {month: 'long', year: 'numeric'});
  document.getElementById('csv').href = '/api/transfers/statement.csv?month=' + M + (SHOW_VOID ? '&voided=1' : '');
  document.getElementById('settle').href = '/transfer/settle?month=' + M;
  const r = await fetch('/api/transfers/statement?month=' + M + (SHOW_VOID ? '&voided=1' : ''), {credentials: 'include'});
  if (r.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); return; }
  const s = await r.json();
  document.getElementById('settle').style.display = s.owes ? '' : 'none';
  let h = '<div class="card"><div class="big ' + (s.owes ? '' : 'even') + '">' + (s.owes ? esc(s.owes.debtor_entity) + ' owes ' + esc(s.owes.creditor_entity) + ' ' + money(s.owes.amount) : 'Even — nets to $0.00') + '</div>' +
       '<div class="sub" style="margin-top:6px">' + s.lines.length + ' item' + (s.lines.length === 1 ? '' : 's') + ' moved · ' + s.detail.filter(d => d.status === 'logged' && !d.is_settlement).length + ' transfers' + (s.voided ? ' · ' + s.voided + ' voided' : '') + '</div></div>';
  if (s.unpriced.length) h += '<div class="card warn">No price for: ' + s.unpriced.map(u => esc(u.item)).join(', ') + ' — not in the balance until priced.</div>';
  if (s.needs_link) h += '<div class="card warn">' + s.needs_link + ' transfer(s) need a product link at the receiving house (<a href="/transfer/admin#links" style="color:inherit">review</a>).</div>';
  if (s.categories.length) {
    h += '<div class="h">By category</div><div class="card"><table><thead><tr><th>Category</th><th class="n">Chatham → Dennis</th><th class="n">Dennis → Chatham</th><th class="n">Net</th></tr></thead><tbody>' +
      s.categories.map(c => '<tr><td>' + esc(c.category) + '</td><td class="n">' + money(c.chatham_to_dennis) + '</td><td class="n">' + money(c.dennis_to_chatham) + '</td><td class="n">' + money(c.net) + '</td></tr>').join('') + '</tbody></table>' +
      '<div class="muted" style="margin-top:8px">Net + means Dennis has Chatham\'s stock (Red Nun Public House owes Red Buoy).</div></div>';
  }
  h += '<div class="h">Netted by item</div><div class="card"><table class="lines"><thead><tr><th>Item</th><th class="n">Chatham → Dennis</th><th class="n">Dennis → Chatham</th><th class="n">Net</th><th class="n">Net $</th></tr></thead><tbody>' +
    (s.lines.length ? s.lines.map(l => '<tr class="' + (l.net_cost === 0 && l.net_qty === 0 ? 'zero' : '') + '"><td class="name" data-l="">' + esc(l.name) + (l.needs_link ? ' <span class="muted">needs link</span>' : '') +
      '<div class="muted">' + esc(l.category) + '</div></td><td class="n" data-l="Chatham → Dennis">' + q(l.c2d_qty) + ' ' + esc(l.base_unit || '') + '</td><td class="n" data-l="Dennis → Chatham">' + q(l.d2c_qty) + ' ' + esc(l.base_unit || '') +
      '</td><td class="n" data-l="Net">' + (l.net_qty === 0 ? 'even' : q(Math.abs(l.net_qty)) + ' ' + esc(l.base_unit || '') + (l.net_qty > 0 ? ' to Dennis' : ' to Chatham')) + '</td><td class="n" data-l="Net $">' + money(l.net_cost) + '</td></tr>').join('')
      : '<tr><td colspan="5" class="muted">No transfers this month.</td></tr>') + '</tbody></table></div>';
  if (s.returns.length) h += '<div class="h">Returns in kind (settle earlier months — not new activity)</div><div class="card"><table><tbody>' +
    s.returns.map(r => '<tr><td>' + esc(r.date) + '</td><td>' + esc(r.qty + ' ' + (r.unit || '') + ' ' + r.item) + '</td><td class="n">' + money(r.cost) + '</td></tr>').join('') + '</tbody></table></div>';
  h += '<div class="h" style="display:flex;justify-content:space-between">Line detail <label class="muted" style="text-transform:none;letter-spacing:0"><input type="checkbox" ' + (SHOW_VOID ? 'checked' : '') + ' onchange="SHOW_VOID=this.checked;load()"> show voided</label></div>' +
    '<div class="card"><table class="lines"><thead><tr><th>Date</th><th>Way</th><th>Item</th><th class="n">Qty</th><th class="n">$</th><th>By</th><th>Said</th></tr></thead><tbody>' +
    s.detail.map(d => '<tr style="' + (d.status === 'voided' ? 'text-decoration:line-through;color:var(--text3)' : '') + '"><td data-l="Date">' + d.date.slice(4, 6) + '/' + d.date.slice(6) + '</td><td data-l="Way">' +
      (d.from_location === 'chatham' ? 'C → D' : 'D → C') + (d.is_settlement ? ' (return)' : '') + '</td><td class="name" data-l="">' + esc(d.item) + '</td><td class="n" data-l="Qty">' + d.qty + ' ' + esc(d.unit || '') +
      '</td><td class="n" data-l="$">' + money(d.cost) + '</td><td data-l="By">' + esc(d.by || '') + '</td><td class="muted" data-l="Said">' + esc(d.said || '') + '</td></tr>').join('') + '</tbody></table></div>';
  document.getElementById('out').innerHTML = h;
}
load();
</script>
<script src="/static/sidebar.js"></script>
</body>
</html>
