<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Red Nun — Phone setup</title>
<style>
:root{--bg:#000;--card:#16161a;--line:#3a3a44;--text:#fff;--dim:#b8b8c4;--green:#30D158;--blue:#0A84FF;--red:#FF453A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:500 17px -apple-system,system-ui,sans-serif;padding:28px 16px 40px;max-width:560px;margin:0 auto}
h1{font-size:26px;margin-bottom:6px}
p{color:var(--dim);margin:8px 0;line-height:1.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.card h2{font-size:17px;margin-bottom:6px}
a.btn{display:block;text-align:center;margin-top:12px;padding:18px;border-radius:14px;background:var(--green);color:#000;
  font-weight:800;font-size:19px;text-decoration:none}
a.btn.alt{background:var(--blue);color:#fff}
ol{margin:8px 0 0 20px;color:var(--dim)}
li{margin:6px 0}
code{background:#222;padding:2px 6px;border-radius:6px;color:#fff;word-break:break-all}
.bad{color:var(--red)}
</style>
</head>
<body>
<div id="app"><p>Setting up…</p></div>
<script>
const TKEY = 'rn_move_token';
const tok = decodeURIComponent((/[#&]k=([^&]+)/.exec(location.hash) || /^#(rn_[\w-]+)$/.exec(location.hash) || [])[1] || '');
function desc(kind){
  const t = kind === 'transfer';
  return 'Call it ' + (t ? 'Log Transfer' : 'Log Waste') + '. Do these steps in order, with no other checks:\n' +
    '1. Dictate text with the prompt "' + (t ? 'What\'s moving, and to which house?' : 'What got wasted, how much, and why?') + '", stop listening after a pause.\n' +
    '2. POST JSON {"text": the dictated text} to https://dashboard.rednun.com/api/' + (t ? 'transfers' : 'waste') + '/voice with header Authorization: Bearer ' + tok + '.\n' +
    '3. Choose from a list: the list is the "menu" value from that response, and the prompt is the "card" value from that response.\n' +
    '4. POST JSON {"choice": the chosen item} to the same URL with the same header.\n' +
    '5. Speak the "say" value from that second response.\n' +
    '6. If the second response has an "open_url" value, open that URL.';
}
function cp(el, text){ navigator.clipboard.writeText(text).then(() => { el.textContent = 'Copied ✓ — now paste it in Shortcuts'; }); return false; }
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
(async () => {
  const app = document.getElementById('app');
  if (!tok) { app.innerHTML = '<h1 class="bad">This link is missing its key.</h1><p>Ask Mike to send your setup link again.</p>'; return; }
  const r = await fetch('/api/moves/whoami', {headers: {Authorization: 'Bearer ' + tok}}).catch(() => null);
  if (!r || r.status === 401) { app.innerHTML = '<h1 class="bad">This link doesn\'t work.</h1><p>It may have been turned off. Ask Mike for a new one.</p>'; return; }
  const u = await r.json();
  try { localStorage.setItem(TKEY, tok); } catch(e) {}
  const k = '#k=' + encodeURIComponent(tok);
  app.innerHTML =
    '<h1>Hi ' + esc(u.person) + ' 👋</h1><p>This phone is set up for <b>Transfer</b> and <b>Waste</b>' + (u.home ? ' at ' + esc(u.home === 'chatham' ? 'Chatham' : 'Dennis') : '') + '. No dashboard login needed.</p>' +
    '<div class="card"><h2>1. Siri: "Log Transfer" and "Log Waste"</h2>' +
    '<p>For each one: tap <b>Copy</b>, open the Shortcuts app, tap <b>+</b>, and paste into <b>Describe a shortcut</b>. Your key is already in it — don\'t share it.</p>' +
    '<a class="btn alt" href="#" onclick="return cp(this, desc(\'transfer\'))">Copy “Log Transfer”</a>' +
    '<a class="btn alt" href="#" onclick="return cp(this, desc(\'waste\'))">Copy “Log Waste”</a>' +
    '<p style="margin-top:10px">Run each once by tapping it and press <b>Allow</b> for dashboard.rednun.com. ' +
    'Then hold the side button and say <b>"log transfer"</b> or <b>"log waste"</b>.</p></div>' +
    '<div class="card"><h2>2. Or tap it in (no signal needed)</h2>' +
    '<a class="btn" href="/transfer' + k + '">Open Transfer</a><a class="btn" href="/waste' + k + '">Open Waste</a>' +
    '<ol><li>Open one, tap Share, then <b>Add to Home Screen</b>.</li><li>Use that icon from now on — it stays set up.</li></ol></div>';
})();
</script>
</body>
</html>
